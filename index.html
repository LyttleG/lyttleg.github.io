<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Gérôme GUILLEMIN | CV</title>
  <meta name="description" content="CV de Gérôme GUILLEMIN. Ouvrez ou téléchargez le PDF.">
  <meta name="theme-color" content="#0b1220">

  <style>
    :root {
      --bg: #0b1220;
      --bg-2: #111a2e;
      --card: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.14);
      --text: #f7f9fc;
      --muted: #aeb9cc;
      --accent: #7dd3fc;
      --dark: #08111f;
      --radius: 24px;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(125, 211, 252, 0.14), transparent 32%),
        radial-gradient(circle at 90% 15%, rgba(167, 139, 250, 0.16), transparent 30%),
        linear-gradient(135deg, var(--bg), var(--bg-2));
      line-height: 1.5;
    }

    .page {
      min-height: 100dvh;
      width: min(880px, calc(100% - 32px));
      margin: 0 auto;
      padding: calc(16px + env(safe-area-inset-top, 0px)) 0 calc(16px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(220px, 0.6fr);
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: var(--radius);
    }

    .intro {
      padding: clamp(24px, 5vw, 48px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .eyebrow {
      width: fit-content;
      margin-bottom: 16px;
      padding: 6px 12px;
      border: 1px solid rgba(125, 211, 252, 0.24);
      border-radius: 999px;
      color: var(--accent);
      background: rgba(125, 211, 252, 0.08);
      font-size: 0.8rem;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 11vw, 4.6rem);
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .subtitle {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .button {
      flex: 1 1 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 12px 18px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: inherit;
      text-decoration: none;
      font-weight: 700;
      transition: transform 160ms ease, border-color 160ms ease;
    }

    .button:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.3); }
    .button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .button-primary {
      color: var(--dark);
      background: linear-gradient(135deg, var(--accent), #c4b5fd);
      border-color: transparent;
    }

    .button-secondary { background: rgba(255, 255, 255, 0.06); }

    .qr-card {
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .qr-card p {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .qr-frame {
      width: min(180px, 100%);
      aspect-ratio: 1;
      padding: 10px;
      background: #fff;
      border-radius: 16px;
    }

    .qr-frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .qr-link {
      margin-top: 12px;
      color: var(--accent);
      text-decoration: none;
      word-break: break-word;
      font-size: 0.85rem;
    }

    footer {
      color: var(--muted);
      text-align: center;
      font-size: 0.8rem;
    }

    /* Mobile : tout sur un seul écran, QR code masqué (inutile sur le téléphone lui-même) */
    @media (max-width: 700px) {
      .hero { grid-template-columns: 1fr; }
      .qr-card { display: none; }
      .actions { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      .button { transition: none; }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="hero">
      <div class="card intro">
        <div class="eyebrow">CV professionnel</div>

        <h1>Gérôme<br>GUILLEMIN</h1>

        <p class="subtitle">Mon CV en PDF, à ouvrir ou à télécharger.</p>

        <div class="actions">
          <a class="button button-primary" href="./Gerome%20GUILLEMIN_CV.pdf" target="_blank" rel="noopener">
            Ouvrir le CV
          </a>
          <a class="button button-secondary" href="./Gerome%20GUILLEMIN_CV.pdf" download="Gerome GUILLEMIN_CV.pdf">
            Télécharger le PDF
          </a>
        </div>
      </div>

      <aside class="card qr-card">
        <p>Scannez pour ouvrir mon CV</p>
        <div class="qr-frame">
          <img src="qr-code-lyttleg-github-io.png" alt="QR code vers https://lyttleg.github.io/" loading="lazy">
        </div>
        <a class="qr-link" href="https://lyttleg.github.io/">lyttleg.github.io</a>
      </aside>
    </section>

    <footer>© 2026 Gérôme GUILLEMIN</footer>
  </main>
</body>
</html>
